# ── INICIO: docs.yml (16.1) ──
# Constrúe e publica a documentación pública (docs-site, Astro/Starlight)
# en GitHub Pages en cada push a main. Separado do CI e da release a
# propósito: un workflow simple por responsabilidade. O build do site é
# a garda de podrecemento (render da galería + tradución completa +
# ligazóns): se algo diso falla, non se publica.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O render da galería precisa o CLI compilado (e este, os paquetes
      # dos que depende); turbo resolve a orde.
      - name: Build docs site (render gallery + i18n check + astro build)
        run: pnpm run docs:build

      # ── 18.0: o editor vivo como subcamiño /editor/ do MESMO artefacto ──
      # Pages = un site por repo (xa ocupado polas docs), así que o
      # editor constrúese co base do subcamiño e cópiase dentro. O
      # vite.config le VITE_BASE; os alias a src/ fan que non precise
      # turbo build previo. O service worker da PWA queda con scope
      # estrito a /editor/ (non toca as docs).
      - name: Build editor (public, base /editor/)
        run: pnpm --filter @yggdrasil-forge-examples/editor exec vite build
        env:
          VITE_BASE: /yggdrasil-forge/editor/

      - name: Copy editor into the Pages artifact
        run: cp -r examples/editor/dist docs-site/dist/editor

      # Se a copia falla, o deploy falla — nunca publicar un botón roto.
      - name: Assert editor is present in the artifact
        run: |
          test -f docs-site/dist/editor/index.html
          test -f docs-site/dist/editor/sw.js
          test -f docs-site/dist/editor/manifest.webmanifest

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
# ── FIN: docs.yml ──

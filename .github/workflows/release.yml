# Workflow de release — AUDITADO en 16.5 (release 1.0).
#
# QUE fai: en cada push a main, changesets/action mira .changeset/:
#   - Se hai changesets pendentes → abre/actualiza o PR «chore: version
#     packages» (corre `pnpm changeset:version`: bumps + CHANGELOGs +
#     lockfile + format).
#   - Se NON hai changesets pendentes (é dicir, tras fusionar ese PR) →
#     PUBLICA en npm (`pnpm changeset:publish` = build:packages +
#     changeset publish) cada paquete público cuxa versión non estea
#     xa no registry, e crea UN TAG POR PAQUETE (p.ex.
#     @yggdrasil-forge/core@1.0.0) + GitHub Release por tag.
#   - Os paquetes `private: true` (editor-core/editor-react)
#     versiónanse pero NIN se publican NIN se etiquetan
#     (privatePackages.tag=false).
# O tag ANOTADO global v1.0.0 e a Release consolidada NON os crea este
# workflow: créaos o dono (ver .github/RELEASE_NOTES_v1.0.0.md).
#
# CREDENCIAL: secret NPM_TOKEN (npm Granular Token, ámbito
# «All packages» + «Bypass 2FA» — os paquetes a versión nova poden
# contar como novos aos ollos de npm). Sen el, o PR de versión
# xérase igual pero o publish falla.
#
# Setup require (acción humana en npmjs.com + GitHub UI):
# 1. Reservar @yggdrasil-forge en npmjs.com (se non está xa).
# 2. Crear NPM_TOKEN (tipo "Automation") en npmjs.com.
# 3. Engadir como secret NPM_TOKEN no repo de GitHub
#    (Settings → Secrets and variables → Actions → New secret).
#
# Sen NPM_TOKEN configurado, o publish step fallará silenciosamente
# pero o version PR seguirá xerándose correctamente.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:packages

      - name: Test
        run: pnpm test

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
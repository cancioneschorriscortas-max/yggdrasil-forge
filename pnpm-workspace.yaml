packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'

# Catálogo de versións compartidas para devDependencies do monorepo.
# Os paquetes refírense con `catalog:` no canto da versión literal.
catalog:
  tsup: ^8.3.0
  vitest: ^4.1.0
  '@vitest/coverage-v8': ^4.1.0
  fake-indexeddb: ^6.2.5
  opfs-mock: ^2.7.0
  typescript: ^5.4.0
  react: 19.2.7
  react-dom: 19.2.7
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  jsdom: ^25.0.0
  '@testing-library/react': ^16.0.0
  '@vitejs/plugin-react': ^4.3.0
  dockview-react: ^6.6.1
  # Panel Código (7.15b). Un só ficheiro importa CodeMirror
  # (packages/editor-react/src/panels/code/CodeEditor.tsx).
  '@codemirror/state': ^6.5.0
  '@codemirror/view': ^6.36.0
  '@codemirror/commands': ^6.8.0
  '@codemirror/language': ^6.10.0
  '@codemirror/lang-json': ^6.0.1
  '@lezer/highlight': ^1.2.0
  jsonc-parser: ^3.3.1

# Build scripts aprobados (pnpm 11 require aprobación explícita).
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  # Engadir aquí calquera novo build script aprobado.
